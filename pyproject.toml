[project]
name = "fraghub"
version = "2.0.0"
requires-python = ">=3.12"
# Seulement ce que le code importe directement ; uv installe le reste (dépendances des dépendances).
dependencies = [
    "fastapi",
    "fraghub-rust",
    "mzspeclib>=1.0.7",
    "psutil",
    "pydantic",
    "python-socketio",
    "uvicorn",
]

# Outils de développement (installés aussi par `uv sync`) : maturin pour le moteur Rust, PyInstaller pour
# l'exécutable, pytest pour les tests (voir TESTS.md) ; httpx sert aux tests de l'API du serveur (TestClient de
# FastAPI), pyarrow et numpy aux tests des scripts de la base interne (scripts/build_dataset).
[dependency-groups]
dev = [
    "maturin>=1.5,<2.0",
    "pyinstaller",
    "pytest>=8",
    "httpx",
    "pyarrow",
    "numpy",
]

# Tests Python : `python run_tests.py --python` ou `python -m pytest` (voir TESTS.md)
[tool.pytest.ini_options]
testpaths = ["tests"]
# Les modules de scripts/ s'importent comme quand FragHub les lance (import internal_database...)
pythonpath = [".", "scripts", "scripts/build_dataset"]
addopts = "-ra"
# Test de bout en bout (tout FragHub sur un petit jeu d'entrée, une à deux minutes) : `-m "not bout_en_bout"` pour
# le sauter (python run_tests.py --python --fast)
markers = ["bout_en_bout: tout FragHub sur un petit jeu d'entrée, comparé à une sortie de référence"]
# Avertissements internes des bibliothèques mzspeclib (SQLAlchemy 2) et anyio (pytest 9), sans rapport avec FragHub
filterwarnings = ["ignore:.*declarative_base.*", "ignore:.*CallSpec2.*"]

[tool.uv.workspace]
members = [
    "scripts/fraghub_rust",
]

[tool.uv.sources]
fraghub-rust = { workspace = true }
